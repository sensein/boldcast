[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "boldcast"
version = "0.1.0"
description = "Atlas-free, surface-based hybrid-Mamba foundation model for joint stimulus–brain latent state tracking from naturalistic fMRI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Yibei Chen" }]
keywords = ["fMRI", "Mamba", "neuroimaging", "CIFTI", "foundation model", "brain decoding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    # Deep learning
    "torch>=2.1",
    "torchvision>=0.16",
    # Mamba SSM (install from source: pip install mamba-ssm)
    "mamba-ssm>=1.2.0",
    "causal-conv1d>=1.1.0",
    # Neuroimaging I/O
    "nibabel>=5.0",
    "nilearn>=0.10",
    # Geodesic surface partitioning (choose one; trimesh is broader)
    "trimesh>=4.0",
    "pygeodesic>=0.1.7",
    # Stimulus embeddings
    "transformers>=4.40",
    "open-clip-torch>=2.24",
    # Experiment tracking and config
    "wandb>=0.16",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    # Scientific Python stack
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # ruff covers both linting (`ruff check`) and formatting (`ruff format`).
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]
notebooks = [
    "jupyter>=1.0",
    "ipywidgets>=8.0",
    "plotly>=5.20",
    "surfplot>=0.2",        # cortical surface plotting
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
Repository = "https://github.com/sensein/boldcast"
"Bug Tracker" = "https://github.com/sensein/boldcast/issues"

# ---------------------------------------------------------------------------
# Tool configurations
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["."]
include = ["boldcast*"]
exclude = ["experiments*", "tests*", "scripts*", "benchmarks*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["boldcast", "tests", "scripts", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Validation scripts use a sys.path bootstrap so they self-locate when run
# as ``python scripts/foo.py`` from any worktree (with or without an
# editable boldcast install in the active env). The bootstrap necessarily
# runs before the ``from boldcast...`` imports, which trips E402.
"scripts/day*_*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=boldcast --cov-report=term-missing -m 'not gpu'"
markers = [
    "gpu: requires a CUDA-capable GPU and the micromamba env (mamba-ssm / causal-conv1d). Skipped on login-node uv gates; run explicitly via `pytest -m gpu` on a compute node.",
]

[tool.coverage.run]
source = ["boldcast"]
omit = ["tests/*", "benchmarks/*", "scripts/*", "experiments/*"]
