name: boldcast

channels:
  - conda-forge      # PyTorch, CUDA toolkit, and everything else

dependencies:
  # ── Python ──────────────────────────────────────────────────────────────
  - python=3.11

  # ── CUDA + PyTorch (conda-forge handles version alignment) ─────────────
  - pytorch-gpu>=2.3              # conda-forge GPU metapackage (pulls CUDA PyTorch)
  - torchvision>=0.18
  - cuda-version=12               # constrain CUDA major version for solver
  - cuda-nvcc                      # CUDA compiler — needed to build mamba-ssm / causal-conv1d
  - cuda-cudart-dev                # CUDA runtime headers for extension builds
  - nccl                           # multi-GPU collective ops

  # ── Neuroimaging I/O ────────────────────────────────────────────────────
  - conda-forge::nibabel>=5.0
  - conda-forge::nilearn>=0.10
  - conda-forge::hdf5            # nibabel CIFTI2 backend
  - conda-forge::h5py>=3.10

  # ── Geodesic surface partitioning ───────────────────────────────────────
  - conda-forge::trimesh>=4.0
  - conda-forge::pygeodesic>=0.1.7
  - conda-forge::rtree           # trimesh spatial indexing

  # ── Scientific Python stack ─────────────────────────────────────────────
  - conda-forge::numpy>=1.26
  - conda-forge::scipy>=1.12
  - conda-forge::scikit-learn>=1.4
  - conda-forge::pandas>=2.2

  # ── Visualization ───────────────────────────────────────────────────────
  - conda-forge::matplotlib>=3.8
  - conda-forge::seaborn>=0.13

  # ── Dev tooling ─────────────────────────────────────────────────────────
  - conda-forge::ruff>=0.4
  - conda-forge::black>=24.0
  - conda-forge::pytest>=8.0
  - conda-forge::pytest-cov>=5.0
  - conda-forge::pre-commit>=3.7
  - conda-forge::mypy>=1.9

  # ── Notebooks ───────────────────────────────────────────────────────────
  - conda-forge::jupyterlab>=4.0
  - conda-forge::ipywidgets>=8.0
  - conda-forge::plotly>=5.20

  # ── pip-only packages (no conda build available) ────────────────────────
  - pip
  - pip:
    # Mamba SSM — must be built against the CUDA toolkit above
    - mamba-ssm>=1.2.0
    - causal-conv1d>=1.1.0
    # Stimulus embeddings
    - transformers>=4.40
    - open-clip-torch>=2.24
    # Experiment tracking & config
    - wandb>=0.16
    - hydra-core>=1.3
    - omegaconf>=2.3
    # Cortical surface plotting
    - surfplot>=0.2
    # Install boldcast itself in editable mode
    # - -e .
