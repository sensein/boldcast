# BOLDcast 10-day demo config (see docs/10_day_plan.md).
# Single source of truth for all demo scripts. No CLI overrides except --seed.

defaults:
  - arch: demo
  - _self_

seed: 0

# Data ----------------------------------------------------------------------
data:
  dataset: hcp_rest
  hcp_root: ${oc.env:HCP_ROOT}
  # Per-subject mesh dir (subject ID is interpolated by the loader, not Hydra).
  surface_dir_template: ${oc.env:HCP_ROOT}/{subject}/MNINonLinear/fsaverage_LR32k
  # Standard HCP minimal-preprocessing CIFTI: 32k_fs_LR + MNI152, MSMAll-aligned,
  # FIX-ICA cleaned, hp2000 high-pass. Grayordinate-level — not parcellated.
  dtseries_pattern: ${oc.env:HCP_ROOT}/{subject}/MNINonLinear/Results/{run}/{run}_Atlas_MSMAll_hp2000_clean.dtseries.nii
  # Family-disjoint splits for K99 preliminary results.  Generated by
  # `scripts/build_family_disjoint_splits.py` on 2026-05-15 from the
  # WU-Minn HCP Restricted Family_ID column; zero family overlap between
  # train and heldout.  Day-5 training will fail loudly if these files
  # are absent (no silent fallback to the original random splits below).
  # To revert to the seed-grant-demo random splits, swap the active
  # pointer to the commented lines.
  subjects_train_file: configs/subjects_train_familydisjoint.txt
  subjects_heldout_file: configs/subjects_heldout_familydisjoint.txt
  # Pre-K99 random splits (family overlap uncontrolled — seed-grant demo
  # only; do not use for K99 prelim):
  # subjects_train_file: configs/subjects_train.txt
  # subjects_heldout_file: configs/subjects_heldout.txt
  # HCP 7T resting-state, 4 of 8 REST runs available locally (alternating PE,
  # one per REST scan). When the other 4 PEs are pulled from datalad, expand
  # this list and update the windowing math in docs/10_day_plan.md.
  runs:
    - rfMRI_REST1_7T_PA
    - rfMRI_REST2_7T_AP
    - rfMRI_REST3_7T_PA
    - rfMRI_REST4_7T_AP
  tr_seconds: 1.0

# Tokenization ---------------------------------------------------------------
tokenize:
  n_patches_cortex: 1024
  fps_seed: 0
  # Cache filename embeds the FPS metric (`_geo` for geodesic_dijkstra,
  # `_eu3d` for euclidean3d) per docs/adr/0002 — defense-in-depth on top
  # of the (n_patches, seed, metric) metadata key inside the .npz.
  patch_cache: cache/patches_fsLR_32k_n1024_seed0_geo.npz
  knn_k: 8
  knn_cache: cache/knn_k8_n1024.npz
  cache_dir: ${oc.env:SCRATCH,/tmp}/boldcast/cache_demo
  standardize: run_wise   # mean/std per run before caching

# Windowing ------------------------------------------------------------------
window:
  size: 256
  stride: 128

# Training -------------------------------------------------------------------
# 3000 steps ≈ 63 epochs over 16 train subjects (384 windows / batch 8 = 48
# steps/epoch). 7T REST runs are ~900 TRs at TR=1.0s; (900-256)/128+1 ≈ 6
# windows/run × 4 runs × 16 subjects = 384 train windows. High epoch count
# is acceptable with regularization below; if held-out loss saturates before
# step 3000, take the earliest checkpoint that meets the held-out criterion.
train:
  batch_size_per_gpu: 4
  grad_accum_steps: 1
  max_steps: 3000
  lr: 3.0e-4
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 100
  grad_clip_norm: 1.0
  schedule: cosine
  precision: bf16
  forecasting_horizons: [1, 5]
  log_every: 50
  ckpt_every: 500
  out_dir: results/day5_train

# Held-out eval --------------------------------------------------------------
eval:
  batch_size_per_gpu: 4
  out_dir: results/day7_fingerprint
  windows_seconds: [15, 30, 60, 300]   # for window sweep
  topk: [1, 5, 10]

# Schaefer-400 ROI baseline (day 6) ------------------------------------------
# CIFTI surface release on fs_LR_32k from CBIG (NOT the volumetric nilearn
# fetcher). Same input dtseries as BOLDcast — only the tokenization differs.
baseline:
  schaefer_dlabel: ${oc.env:DATA,/tmp}/atlases/Schaefer2018_400Parcels_17Networks_order_fslr32k.dlabel.nii
  n_rois: 400
  cache_dir: ${oc.env:SCRATCH,/tmp}/boldcast/cache_demo_schaefer
  # Separate kNN cache from the BOLDcast 1024-patch one — the centroid
  # geometry and parcel count differ.
  knn_cache: cache/knn_k8_schaefer400.npz
  out_dir: results/day6_baseline

# Distributed ----------------------------------------------------------------
ddp:
  find_unused_parameters: false
  num_gpus: 2
