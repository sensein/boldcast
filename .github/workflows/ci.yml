name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Mirrors the uv `.venv` recipe in README.md "Development setup", minus
      # `transformers` / `open-clip-torch` (nothing under boldcast/, tests/,
      # scripts/, or benchmarks/ imports them yet — add them here when the
      # stimulus stream lands). `mamba-ssm` and `causal-conv1d` are
      # deliberately absent: they need nvcc, which no GitHub runner supplies.
      # That is why the editable install uses --no-deps.
      - name: Create dev environment
        run: |
          uv venv .venv --python 3.11
          uv pip install \
              "torch>=2.1" "nibabel>=5.0" "nilearn>=0.10" \
              "numpy>=1.26" "scipy>=1.12" "scikit-learn>=1.4" \
              "trimesh>=4.0" "omegaconf>=2.3" "hydra-core>=1.3" \
              "wandb>=0.16" "matplotlib>=3.8" "pandas>=2.2" \
              "pytest>=8.0" "pytest-cov>=5.0" "ruff>=0.4" "mypy>=1.9" \
              "pyyaml" --python .venv/bin/python
          uv pip install -e . --no-deps --python .venv/bin/python

      - name: ruff check
        run: .venv/bin/ruff check boldcast/ tests/ scripts/ benchmarks/

      - name: ruff format --check
        run: .venv/bin/ruff format --check boldcast/ tests/ scripts/ benchmarks/

      - name: mypy --strict
        run: .venv/bin/mypy --strict boldcast/

      # `-m 'not gpu'` comes from pyproject addopts: the gpu-marked tests need
      # mamba-ssm and a CUDA device, and run on ORCD compute nodes instead.
      - name: pytest
        run: .venv/bin/pytest
