name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'index.html'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      allow_non_main_sha:
        description: "Deploy even if the checked-out SHA is not on main (previews only)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one in-flight Pages deploy at a time; queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # fetch-depth: 0 so the ancestry guard below can run merge-base.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Force-pushing rewritten history orphans queued runs on pre-rewrite
      # SHAs, and those runs cannot be cancelled (409) or deleted (403) — two
      # from the 2026-08-26 scrub are still sitting in the queue. If one ever
      # starts, it would rebuild and redeploy the pre-scrub site. This makes
      # that a build failure instead of a silent regression.
      - name: Refuse to deploy a SHA that is not on main
        if: ${{ github.event.inputs.allow_non_main_sha != 'true' }}
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_SHA is an ancestor of origin/main."
          else
            echo "::error::Refusing to build the Pages site from $GITHUB_SHA -- not an ancestor of origin/main."
            echo "If this is an intentional preview, re-run via workflow_dispatch with allow_non_main_sha=true."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install MkDocs + theme
        run: pip install mkdocs mkdocs-material

      - name: Build /docs/ with MkDocs → site/docs/
        run: mkdocs build

      - name: Assemble final site (layer /index.html, .nojekyll)
        run: |
          cp index.html site/index.html
          touch site/.nojekyll
          echo "--- site/ contents ---"
          ls -la site/
          echo "--- site/docs/ ---"
          ls site/docs/ | head -10

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
