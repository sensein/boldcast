# Mirrors the CI gates in .github/workflows/ci.yml. Install with:
#   .venv/bin/pre-commit install
# CI is authoritative; this only shortens the feedback loop.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: public-hygiene
        name: public-repository rules
        entry: python scripts/check_public_hygiene.py
        language: system
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=512]
